# SUPERSEDED by ../tests/litesvm.rs and ../tests/venues.rs (see tests/adversarial.rs header and ../REVIEW.md "Disposition").
[package]
# REVIEW-ONLY harness (REVIEW.md): adversarial LiteSVM tests that run the BUILT arbx_exec.so (and nexus_arb_v2.so for
# the v2 parity / CU comparison) against tests/mock-amm loaded at allowlisted venue addresses. Standalone workspace so
# it never touches arbx-exec's own build. Run:  cargo test --release -- --nocapture --test-threads=1
name = "arbx-exec-review"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dev-dependencies]
arbx-exec = { path = ".." }
base64 = "0.22"
litesvm = "0.17"
solana-account = "4"
solana-address = { version = "2.7", features = ["curve25519", "decode"] }
solana-instruction = "3.5"
solana-instruction-error = "2.5"
solana-keypair = "3.1"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"
solana-transaction-error = "3.4"
