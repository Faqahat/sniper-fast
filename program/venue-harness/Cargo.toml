[package]
name = "venue-harness"
version = "0.1.0"
edition = "2021"
description = "Exactness harness: the REAL mainnet venue programs (dumped ELFs) run in LiteSVM on mainnet account snapshots"
publish = false

# Standalone (not a member of any workspace): its own lock file and target directory.
[workspace]

[lib]
path = "src/lib.rs"

# Read-only fixture fetcher (public mainnet RPC, rate-limited, cached). Uses the system `curl` for HTTP, so the crate
# needs no TLS stack.
[[bin]]
name = "fetch-fixtures"
path = "src/bin/fetch_fixtures.rs"

# Run swaps from the command line: venue-swap <pool> <0|1> <amount>...
[[bin]]
name = "venue-swap"
path = "src/bin/venue_swap.rs"

[dependencies]
# The solana-* versions below are the ones litesvm 0.17 (agave 4.3) is built on (same set as program/arbx-exec).
litesvm = "0.17"
solana-account = "4"
solana-address = { version = "2.7", features = ["curve25519"] }
solana-clock = "3.2"
solana-rent = "~4.4"
solana-instruction = "3.5"
solana-instruction-error = "2.5"
solana-keypair = "3.1"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"
solana-transaction-error = "3.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
# the SVM is slow unoptimised; tests run in a few seconds with this
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
