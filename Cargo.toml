[package]
name = "arbx"
version = "0.1.0"
edition = "2021"
description = "arbx: Solana atomic arbitrage bot (evolved from arb-lab); many feeds in, one engine, measured end to end"

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
curve25519-dalek = "4"
aes-gcm = "0.10"
dotenvy = "0.15"
ed25519-dalek = "2"
http = "1"
libc = "0.2"
prost = "0.13"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustc-hash = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scrypt = { version = "0.11", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
