[package]
name = "shreder_rec"
version = "0.1.0"
edition = "2021"
description = "Shreder preconf + Binary stream recorder (read-only measurement, no trading)"

# standalone: never part of the sniper workspace
[workspace]

[lib]
name = "shreder_rec"
path = "src/lib.rs"

[[bin]]
name = "shreder_rec"
path = "src/main.rs"

[dependencies]
tonic = { version = "=0.14.6", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "=0.14.6"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
bs58 = "0.5"
base64 = "0.22"
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[build-dependencies]
tonic-prost-build = "=0.14.6"
protoc-bin-vendored = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[dev-dependencies]
serde_json = "1"
