[package]
name = "arbx"
version = "0.1.0"
edition = "2021"
description = "arbx: Solana atomic arbitrage bot (evolved from arb-lab); many feeds in, one engine, measured end to end"
# build provenance (git commit, dirty state, rustc, profile) for meta.json; named so it does not clash with the
# transaction builder src/build.rs (PLAN WP-01 item 3)
build = "buildinfo.rs"

[dependencies]
anyhow = "1"
# the venue maths (PLAN-ADDENDUM WP-16): exact quotes proven against the real venue binaries (program/venue-harness),
# the same code arbx-exec's on-chain sizing runs. no_std, no dependencies of its own
# PLAN-ADDENDUM WP-21: with Raydium CLMM and Orca Whirlpool (kinds 7 and 8, feature "clmm"; DESIGN.md §9)
arbx-sizing = { path = "program/arbx-sizing", features = ["clmm"] }
base64 = "0.22"
bs58 = "0.5"
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
curve25519-dalek = "4"
aes-gcm = "0.10"
# review WP-07 #15: the keystore cipher's round keys (the first two are the scrypt key itself) are wiped when it goes
aes = { version = "0.8", features = ["zeroize"] }
dotenvy = "0.15"
ed25519-dalek = "2"
http = "1"
libc = "0.2"
# FAST (--fast-send): our own HTTP/1.1 send connections (rustls roots + response parsing); both already in Cargo.lock
webpki-roots = "0.26"
httparse = "1"
# meta.json `programs[].elf_md5` (the reproducible-build hash the owner compares; sha256 is the gate)
md-5 = "0.10"
prost = "0.13"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustc-hash = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scrypt = { version = "0.11", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# stop reasons: the signal and its sender (pid, uid) via SignalsInfo<WithOrigin> (PLAN WP-01 item 5)
signal-hook = { version = "0.3", features = ["extended-siginfo"] }
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
toml = "0.8"
# the recorder's in-process compression: one zstd frame per flush (MEASUREMENT §1.3; PLAN WP-02)
zstd = { version = "0.13", default-features = false }
# accounts.bin `data_xxh3` and state-version hashes (MEASUREMENT §2.1, §4.12; PLAN WP-03)
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
