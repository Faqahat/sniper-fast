# ---------------------------------------------------------------- steps 1-3 of the send plan
# step 1 (keep-alives) runs whenever send paths are enabled; steps 2 and 3 below.
[exec]
program = "8K8uyQDtVKHYRPACP9fepz91q4sEZLBppR2Ty4vdXuWg"
rpc = ["haan", "shyft"]   # Helius expired: Haan (fastest) raced with Shyft for the simulation gate, statuses, landed txs
max_size_sol = 4.2      # $500 run (owner, 2026-10-03): the new wallet holds 4.2 WSOL
keepalive_s = 30

[sim]
# step 2, free: every would-send decision is built and simulated (sims.jsonl)
max_per_sec = 2

[canary]
# step 3: real transactions built to fail our profit check; needs this AND `arb-lab run --canary`
count = 100
every_ms = 5000
size_sol = 0.01
max_spend_lamports = 3000000   # 0.003 SOL of network fees in all
settle_s = 30
nonce_account = "58XHXCVwizLunHZdtXRr21NXnraG8Y4vQWjpXLN2FgVe"

[live]
# step 4: real trades; needs mode = "live" AND `arb-lab run --live`
max_size_sol = 4.2                # $500 run (owner, 2026-10-03): up to 4.2 SOL a trade from the new wallet WSOL
max_failed_fees_lamports = 25000000   # EXP: $3 for tonight experiments
margin_lamports = 1000              # on-chain min_profit = base fee + priority fee + that copy's tip + this
max_new_token_accounts = 25   # $500 run: the new wallet holds no token accounts yet (rent ~0.0025 SOL each, refundable)
settle_s = 1   # $500 run: free the nonce sooner (189 skips in a minute for lack of one); landings come within 1-2 slots
# testing landing on every path, not profit (owner): Astralane and Bolt get a copy on every trade too
test_all_paths = false   # long run: race_mix decides per trade
# two-tier bid (9EwQoN74's pattern, research log S-010): zero priority by default (a miss costs 5,000), and from
# 100,000 lamports of expected profit a priority fee of half of it (at most 0.005 SOL) to win the next turn on the pool
bid_tiers = false   # long run: fee_rule arms (0.95x trigger / flat 40k), capped
rotate_paths = false   # long run: no rotation
race_mix = false   # exp-1: replaced by bundle_mix
bundle_mix = true   # EXP-1: even trades on every TPU path, odd as a Jito bundle only (no priority fee; a miss costs nothing)
tpu_cu_price_micro = 100000   # EXP-1: the TPU arm bid (winners pay ~0; long run 1 paid 40k)
pair_lock_ms = 400   # EXP-1: one trade per pair per 1.5 s (was the 8 s settle)
sim_gate = true   # EXP-1: simulate a TPU trade before sending (a mispriced DLMM leg never lands as a paid failure)
compete_mult = 0   # SEG2: TPU bid = 1.25x the pools 30-s p75 CU price ...
compete_max_share = 0.10   # SEG3: at most 10% of the expected profit as priority ...
compete_ab = true   # pairs of TPU trades: one competes, one stays flat (10k)
gross_floor = true   # SEG3: on-chain min_profit = tip + 1 (the sim gate keeps the full fees + tip + margin bar)
tpu_max_expected_lamports = 0   # $500 run: no cap (a TPU miss costs ~15k lamports; real gaps at this size are millions)
tpu_skip_mriya_pools = false   # EXP-3b: off: the seed list is all tagged mriya, so it sent nearly everything to bundles
tpu_skip_mints = ["EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"]
tpu_min_expected_lamports = 3000000   # w5h hybrid test: direct copies only for 50k-1M expected
bundle_size_variants = []   # w5h seg 8: a quarter-size copy of every bundle (quotes are exact at small sizes)
spec_cu_price_micro = 40000   # live-run-5: the normal flat bid on every copy, to measure our relay + leader-queue time fairly
bid_min_expected_lamports = 1000000000000000   # CONTEST tier off until the PoH data shows we can reach the trigger
bid_share = 0.5
bid_max_priority_lamports = 5000000
max_priority_lamports = 30000   # at most this priority fee per trade (live-run-1 paid 1.1M once)
