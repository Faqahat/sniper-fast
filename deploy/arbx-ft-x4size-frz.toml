# trading loss: review WP-07 #4; the owner's deposits and withdrawals are not in it, each is recorded and alerted as
# `owner_transfer`) passes 0.02 SOL within a rolling hour, 0.15 SOL within 24 h, or the test budget since the campaign's start;
# a token held at the start (frz's USDC) moved by routes below its start amount less 0.1%. Each stop names its reason
