# ---------------------------------------------------------------- steps 1-3 of the send plan
# step 1 (keep-alives) runs whenever send paths are enabled; steps 2 and 3 below.
[exec]
program = "8K8uyQDtVKHYRPACP9fepz91q4sEZLBppR2Ty4vdXuWg"   # nexus-arb-v2 (arbx-exec only behind WP-15's flag)
rpc = ["haan", "shyft"]   # Helius expired: Haan (fastest) raced with Shyft for the simulation gate, statuses, landed txs
max_size_sol = 4.2      # $500 run (owner, 2026-10-03): the new wallet holds 4.2 WSOL
keepalive_s = 30
# WP-01: the deployed 8K8uyQDt ELF (programdata without header and padding; testdata/programs/README.md). A live run
# whose program on chain differs, or cannot be read, does not send (SendGate shadow, reason program_hash_mismatch)
expected_program_sha256 = "e4f03590bda38d95b884f56a1192070f7e34320840a6d89a568c6ed6024bae2f"
expected_program_md5 = "809315befcb9554211f8019bf9df290b"

# WP-01: <run dir>/control.sock for `arbx ctl --run <dir> status|pause-sending|resume-sending|shadow|stop --who --why`
[control]
socket = true

[sim]
# step 2, free: every would-send decision is built and simulated (sims.jsonl)
max_per_sec = 2

[canary]
# WP-05: a canary run is a live run under these caps (`arbx run --canary` AND enabled = true): real bundles of at most
# size_sol (0.2 SOL at most), at most `count` attempts per segment `every_ms` apart. WP-07: `count` is set for FT-005's 24 h
# baseline: at one attempt a second at most, a 60-minute segment makes at most 3,600 and a whole day 86,400, so the cap
# never binds; the equity stops, the spend cap and the bankroll do (0 would mean no cap at all)
enabled = true
count = 100000
every_ms = 1000
size_sol = 0.2                 # the 0.2 size arm's cap ([experiments.size] holds the 0.05 arm at 0.05)
max_spend_lamports = 5000000   # fees of landed failures per segment (a bundle that fails does not land: should stay 0)

[live]
# step 4: real trades; needs mode = "live" AND `arbx run --live`. WP-05: one-transaction Jito bundles only (the direct
# arm's keys are gone: test_all_paths, bid_*, rotate_paths, race_mix, bundle_mix, tpu_*, pair_lock_ms, sim_gate,
# compete_*, gross_floor, bundle_*, spec/max priority; settle_s: attempts settle from the chain; the durable nonces:
# [send_policy.direct]; big band and crowding: [send_policy])
max_size_sol = 0.2                # the canary's cap here too
max_failed_fees_lamports = 5000000  # each segment's cap; a campaign also passes what is left of the test budget (--budget-left)
margin_lamports = 1000              # the decision's bar: expected profit >= tip + base fee + this (the on-chain floor is [send_policy])
# (WP-06: max_new_token_accounts is gone: a token account the wallet holds none of is created and closed in the trade)
# WP-07 (go-live gate): a trade is at most 85% of the liquid SOL + WSOL minus a 0.03 SOL reserve, and at most the WSOL
bankroll_share = 0.85
bankroll_reserve_sol = 0.03

[send_policy]
# PLAN WP-05: bundle-only, fail closed (no network call between a decision and its fire). A send needs a blockhash from
# the WP-03b ring at most max_blockhash_age_slots old, a target-slot leader whose kind is not skipped, a valid cached
# Jito token, a healthy recorder, the SendGate live and the store ready
max_blockhash_age_slots = 20
blockhash_commitment = "confirmed"
skip_leader_kinds = ["other", "unknown"]   # R §3.6: non-Jito leaders cannot take a bundle
inflight_hold_slots = 2   # one attempt per (buy, sell, mint) until a new state version or a new leader
queue_ms = 10   # the Jito rate queue: bands under 1M first, crowded pools last in their band, then EV
# the >=1M bands (src/bands.rs bands 3-4; 0 of 1,869 legacy bundles there landed while they took the 5/s budget):
# at most 0.5 a second (burst 1), behind every smaller band in the queue
big_band_max_per_sec = 0.5
# crowding (F6): distinct arbitrage-like signers that landed on either pool in the last 6 h, buckets < 20, 20-150, >= 150.
# WP-00's list of the 21 pools with 150+ bots stands in until the map holds 6 h; and (OD-3's alternative, review F2)
# a trade on such a pool expecting >= 100k is not sent: 0 of 1,896 legacy crowded bundles expecting >= 100k landed (12
# of 1,214 under 100k did: those still go). Owner: 0 here = rank only
crowding_window_h = 6
crowding_buckets = [20, 150]
crowded_pools_file = "/root/arbx/data/crowded-pools.json"
crowded_skip_min_expected_lamports = 100000
# on-chain min_profit = tip + base fee + margin, margin = max(floor, share x expected net): Stage 0 keeps today's floor
# (F23); R §3.9's 2,000 / 2% is a WP-11 arm or OD-5
margin_floor = 1
margin_share = 0.0
direct_experiment = false   # the direct (non-bundle) arm: refused in Stage 0

[send_policy.direct]
# (the durable nonces of 2g7rYv7y..., the direct arm's, are not frz's: none here)
nonce_accounts = []

[send_policy.bam]
# FT-006, the BAM landing fix (src/config.rs BamPolicyCfg). FT-004/FT-005: bundles bidding < 0.045 lamports per requested CU
# landed 19/147 on Jito leaders but 2/112 on BAM leaders (also 0/22 behind the Frankfurt BAM node, 0.6 ms away); higher bids
# landed alike (10/508 vs 5/334). Jito's block engine ranks bundles against bundles only (tip per requested CU, 50 ms
# auctions); BAM ranks them against all transactions by fees per CU (bam.dev). So a BAM-led slot bids at least 0.05
# lamports per CU of its CU limit, within 90% of the edge and the decision's bar; Jito-led slots are unchanged
enabled = true
min_tip_per_cu = 0.05
max_share = 0.9
below_floor = "send"   # out of reach: bid what the edge allows (up to max_share); "skip" would not send to the BAM slot

[bands]
# WP-06 item 8 (F22): the one band table (decisions, the send queue, the tips), over the expected edge = gross - base fee;
# bands 0-4, 3 and 4 the >=1M class (as deploy/arbx-stage0.toml)
edges = [20000, 100000, 1000000, 10000000]

[tips]
# WP-06 item 8: a bundle tips clamp(share(band) x edge, floor, cap). 0.7 in every band, 1,000 to 100,000 lamports: the
# status quo this file had on the jito-bundle path (tip_share 0.7, tip_lamports 1,000, tip_max_lamports 100,000);
# contested_shares wait for the Stage 2A Selector
shares = [0.20, 0.20, 0.20, 0.60, 0.70]   # FT-006 (owner 2026-10-06): 0.2 on small gaps (GLiCiNEn pays ~15% of gross), was 0.7 everywhere
contested_shares = [0.16, 0.20, 0.20, 0.60, 0.64]   # FT-006: never above the band share
floor = 1000   # the jito-bundle path's tip_lamports (its minimum) is at most this
cap = 100000   # owner 2026-10-04: bundle tips capped at 0.0001 SOL

[builder]
# WP-06 (go-live gate item 2): a token account the wallet holds none of is created and closed in the same transaction
# (rent-neutral); the held set is WSOL, USDC, USDT and the tokens frz already holds
create_close = true   # false: trade held tokens only (mid_not_held), the held-only control arm
held_max = 0   # the size budget's held-ATA fallback (create, no close: the account's rent stays locked) is OFF: nothing stays locked (review WP-06 #1)
allow_uva_create = false   # a PumpSwap buy without the wallet's volume accumulator would create it (1,346,200 lamports, never recovered): refused (uva_missing); frz has it
loaded_data_limit = "auto" # the transaction's accounts and programs at their measured sizes, +25% +256 KiB (FT-002's dry run simulates it: [dry_run] below)
cu_table = "/root/arbx/data/cu-table.json"   # absolute (review WP-06 #11): a run without the file refuses to start; upload it with the other data files
cu_min_samples = 30
alt_index = true   # over 1,232 bytes: lookup tables learned from decoded transactions that name the route's pools, at most max_alts
max_alts = 4
payer_guard = false   # nexus-v2's max_payer_lamport_drop trailer: on after X6 and a canary
payer_guard_max_drop = 0

[dry_run]
# go-live gate item 4 (`arbx run --dry-run`): every would-send bundle is signed by a throwaway key made in memory (never
# the trading keystore; the payer stays the wallet, so the signature cannot pass on chain), recorded in full
# (attempts.jsonl `dry_run`: the transaction, its size, tip, accounts and checks) and never sent; no send path is built
simulate = true   # FT-002 (review WP-06 #6): also a read-only simulateTransaction (sigVerify off, the blockhash checked), at most max_sim_per_sec: LiteSVM counts no programdata, so only the simulation validates the "auto" loaded-data limit on mainnet state
