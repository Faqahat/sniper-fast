# ---------------------------------------------------------------- send paths
# Checked with `arbx senders --config arbx-stage0.toml` (sends nothing). Stage 0 sends one-transaction Jito bundles only:
# every other path below is disabled (WP-00).
# Secrets come from .env next to this file; `${NAME}` in a url is replaced from it. Tip accounts default to each
# provider's documented list (src/send/mod.rs known_tip_accounts). Tips are paid only when the trade lands.
# WP-05: live and canary runs are bundle-only (a live config with any other path enabled does not load); the Jito gate
# ([gate]) is gone. The send policy is [send_policy] below (PLAN WP-05's `[send]` keys: TOML cannot hold a [send] table
# beside these [[send]] paths). PLAN-ADDENDUM I-10: an enabled path may carry a `${...}` secret over plain http:// only
# with `no_tls_endpoint = "<evidence>"`; `arbx check` refuses it otherwise, and refuses any provider key that is the
# payer's keypair.

[[send]]
# one-transaction bundle through the searcher gRPC; auth key = the whitelisted keypair (CrQx62…EynE), never funded
