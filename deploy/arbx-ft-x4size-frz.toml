rate_per_min = 20       # Telegram allows a group 20 messages a minute
coalesce_ms = 2000      # a burst within 2 s goes out as one message (a Critical alert goes at once)
daily_summary = true    # at 00:00 UTC, the day before: win ratio (wins / bundles sent), net, fees, tips, rent

[watchdog]
# WP-20: `arbx watchdog --config deploy/arbx-canary-frz.toml`, a separate long-running process
# (docs/field-tests/README.md)
runs_dir = "/root/arbx/runs"
grace_s = 120           # no segment process for longer than this is "not running" (covers the gap between two segments)
status_min = 60         # "running" every hour, and a reminder every hour while it is down

[pool_refresh]
# WP-22 (PLAN-ADDENDUM "WP-22: Automatic pool refresh"; src/poolrefresh.rs). `arbx campaign` runs `arbx pools refresh`
# lead_s before each segment ends, beside it (a process of its own at nice 10; it never opens the Haan gRPC stream and
# never uses Haan's RPC); the next segment boots on what it wrote once its report says ok and the file hashes as the
# report says, else on a copy of the previous list (the reason in campaign.json `pool_lists` and a Telegram notice).
enabled = true
cap = 1500                  # the seed rows the list keeps (today's list: 1,500)
max_adds = 60               # at most this many pools added per refresh (5 refreshes in FT-008: at most 300)
min_liquidity_sol = 2.0     # an added pool's WSOL vault holds >= 2 SOL (on chain; FT-008 trades <= 0.2 SOL)
min_liquidity_usdc = 250.0  # (USDC pools: off below; the engine prices WSOL pairs only)
idle_segments = 4           # a listed pool with no trigger, decision, opportunity or rival arbitrage in 4 segments (2 h) goes
quotes = ["WSOL"]           # a token enters with 2+ verified WSOL pools on our venues, the listed ones counted
records = true              # our records: listed pools' activity; rival arbitrage (exec arb_like) on pools we do not list
geckoterminal = true        # trending_pools 5m/1h/6h and new_pools, no key
dexscreener = true          # token-pairs for each candidate token (its full pool set), no key
exec_segments = 1           # the exec records of the running segment only (about 1.3 GB a half hour, read at nice 10)
geckoterminal_per_min = 20  # its public limit is about 30
dexscreener_per_min = 120   # its public limit is about 300
max_tokens = 80             # DexScreener lookups per refresh
http_timeout_s = 10
rpc = ["public"]            # the verification RPC: api.mainnet-beta.solana.com ([[rpc.endpoint]] "public"), which no segment
                            # uses: about 30-50 getMultipleAccounts a refresh, never on Haan (4-5 req/s, the segment's) or Shyft
                            # (its slot index takes 3.8 of its 4 req/s)
rpc_max_rps = 2.0           # this process's own budget on it (the public RPC allows about 4/s per method per IP)
lead_s = 300                # start 5 min before a segment ends
timeout_s = 240             # killed past 4 min (it stops itself 15 s earlier): the previous list stays

[experiments]
# WP-11 (src/experiments.rs): each decision's arm in each experiment is xxh3(seed, experiment, decision id): replayable, and
# the experiments independent of each other; each segment mixes its name into the seed (decision ids restart each
# segment). The first arm of each table is its control. decisions.jsonl `experiments` holds every decision's arms,
# attempts.jsonl `experiments_assigned` the same and `experiments` (and `tip.arm`) the arms that applied, status.jsonl
# `experiments` each arm's decisions, opportunities, sends and refusals, experiments.jsonl the configuration
seed = 20261007

[experiments.x4]
enabled = true
arms = [0.2, 0.1, 0.35]   # the share of the edge in bands 0-2; the first arm is the control: 0.2, today's [tips] shares
weights = [1, 1, 1]
scope_max_band = 2        # bands 0-2: edges under 1,000,000 lamports ([bands] edges)

[experiments.size]
enabled = true
arms_max_sol = [0.05, 0.2]   # the engine's size search stops here; the first arm is the control: 0.05, FT-007's cap
weights = [1, 1]
