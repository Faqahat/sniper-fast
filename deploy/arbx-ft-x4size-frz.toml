[alerts]
# WP-20 (PLAN-ADDENDUM): Telegram alerts to the owner's "ArbX" group, as in deploy/arbx-stage0.toml (integration: the frz
# canary, the first live-money test, runs with them; its campaign tells its start and end). The token and the chat id
# live only in /root/arbx/deploy/.env (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID; mode 600), never in this file: missing ones
# turn the alerts off with one warning, never fatal. Producers never wait (a bounded queue); one sender on rt_bg posts
# over HTTPS. `arbx alert-test --config <this file>` sends one test message.
