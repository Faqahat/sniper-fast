# X4 x size (WP-11 experiment framework, owner 2026-10-07): FT-008's config (deploy/arbx-ft008-frz.toml: FT-007's settings + WP-22's
# pool refresh) with two concurrent, randomized experiments instead of back-to-back 3 h tests that market swings confound
# (FT-006: tips 0.7 -> 0.2 gave +48% net per win but -57% Jito-led landings, +4% net SOL/h; FT-007: the 0.05 SOL cap doubled the
# win ratio, but in FT-006 the 5 wins above 0.05 SOL made half the net). What differs from FT-008, and why:
#   - [experiments.x4]: the tip share of the edge in bands 0-2 (edges under 1,000,000 lamports) is one of 0.2 (today's,
#     the control: listed first), 0.1 and 0.35, by decision; bands 3-4 keep [tips]' 0.6 / 0.7; the floor 1,000 and the cap 100,000 stay; the BAM
#     floor ([send_policy.bam]) still raises BAM-led bids on top; every bound stays (the on-chain min_profit, the decision's
#     bar: expected >= tip + fee + 1,000, the BAM bid's room)
#   - [experiments.size]: the engine's size search stops at 0.05 SOL (today's cap, the control) or at 0.2 SOL, by decision;
#     the small rungs stay for both; so the ladder gains 0.1 and 0.2, and [canary] size_sol / [live] max_size_sol go to 0.2
#     (the 0.05 arm is held at 0.05 by its arm). The bankroll still caps every trade (85% of the liquid SOL + WSOL - 0.03,
#     at most the WSOL: with ~0.19 SOL of WSOL the 0.2 arm trades at most ~0.19 SOL)
#   - the two assign independently (xxh3 of the seed, the experiment and the decision id): a 3 x 2 factorial, every send
#     in one X4 arm and one size arm, each of the 6 cells about a sixth of the decisions
# How many sends (two-sided 5%, 80% power; FT-007's 3.1% wins per send and net per attempt 113 +- 1,450 lamports, FT-006's
# 1.6% and 97 +- 1,960 at the 0.2 cap; at ~700 bundle sends/h an X4 arm gets ~233 sends/h, a size arm ~350/h):
#   - a +-50% change in wins per send: 1,500-2,400 sends per arm; a 2x change in net per attempt: ~2,600 per arm.
#     ~7,500 sends: ~11 h (X4 ~2,500 per arm, size ~3,800 per arm). Run 12 h (12 segments of 60 min)
#   - +-30% in wins per send: ~4,700-6,200 per arm (X4 ~27 h, size ~18 h); +50% in net per attempt: ~10,400 per arm (~45 h)
#     (the 0.2 arm's net varies more: about 2.4x the sends for the same net precision)
#   - the size arms: FT-007 (0.05 cap) won 3.1% of sends and FT-006 (0.2) 1.6%, a difference ~1,500 sends per arm show
#     (~4-5 h); their net per attempt differed by ~15% (113 vs 97 lamports): ~180,000 sends per arm, out of reach (read
#     the per-decision net with its interval: a large difference shows, a small one does not)
# Read it with `arbx-report experiments <campaign dir>`: per arm attempts, landings and wins with 95% intervals, net per attempt
# and per win, tips/gross and the meme / common wins from the ledger, the balance by band and trigger kind, each arm against
# its control per decision (the randomized unit) and per send, the factorial's cells.
# Run (Cherry holds the binary, this file and its data files only):
#   arbx check --config deploy/arbx-ft-x4size-frz.toml
#   arbx campaign --name <ft> --config deploy/arbx-ft-x4size-frz.toml --mode canary --hours 12 --segment-min 60 --who <you> --detach
# then pull each segment's attempts, copies, bundles, outcomes, ledger, snapshots, status, events, experiments.jsonl and
# config.toml (decisions.jsonl too for the exact per-decision counts) and run `arbx-report experiments <campaign dir>`.
#
# arbx canary on the frz wallet (DRAFT, WP-07; WP-06's builder since the Stage-0 merge; docs/field-tests/README.md: FT-004
# first live canary hour, FT-005 24 h canary).
# Derived from deploy/arbx-stage0.toml (the Stage-0 safety switch: bundle-only, fail-closed, no decoded sends); what
# differs, and why:
#   - the wallet is the production wallet frz (FRZh63L6...), the owner's existing keystore used in place: profile "trading"
#     (~/.nexus-v2-trading-wallet.{enc,pass} on Cherry), wallet_keystore = "" (no passphrase: unattended). The run
#     refuses to start unless the key is FRZh63L6...
#   - a canary campaign: `arbx campaign --mode canary` with [canary] enabled below (review WP-07 #5: a manual
#     `arbx run --canary` takes the same campaign lock, other-bot check and cumulative budget, but use the campaign); mode
#     stays "shadow" (a plain run, and --shadow, record only). WP-05's caps: at most 0.2 SOL a trade; WP-07's bankroll cap: never
#     more than 85% of the liquid SOL + WSOL minus a 0.03 SOL reserve, and never more than the WSOL the route spends. frz
#     held ~0.414 SOL liquid on 2026-10-05 (0.2230 native + 0.1915 WSOL): a trade is capped at ~0.19 SOL (its WSOL) of the
#     0.19-0.32 SOL the bankroll allows, under the 0.2 SOL canary cap. Until the first balance snapshot nothing is sent
#     (equity_unknown); a bankroll that allows nothing (no WSOL) is refused as bankroll_empty
#   - the equity stops (WP-07, OD-11 proposed; docs/field-tests/README.md "Enforcement"): the bot goes to shadow and the
#     campaign stops when the net spend (fees, tips, non-recoverable rent, trading loss, from the ledger: the owner's own
#     deposits and withdrawals are not in it) passes 0.02 SOL within a rolling hour, or the test budget since the
#     campaign's start (read from the chain at its first balance snapshot); the ~22.97 USDC frz holds is a quantity floor
#     of its own (routes may not move it by more than 0.1%), never valued into the floor; token-account rent is tracked
#     apart. The test budget: [supervisor] test_budget_lamports = 5,000,000 (FT-004's allotment; --test-budget-lamports can
#     only lower it: FT-005's 10,000,000 needs a copy of this file with 10000000), drawn from the owner's cumulative
#     34,000,000 (/root/arbx/runs/budget-state.json: a start is refused when nothing is left, and cut to what is left)
#   - the money view is checked fresh: snapshots every 10 minutes inside a segment; stale (10 minutes, 3 failures, a
#     landing without its record for 2 minutes) means nothing is sent (`equity_stale`) until it is fresh
#   - no rent locked by a trade (go-live gate item 2; WP-06, merged at the end of Stage 0): frz holds token accounts for
#     WSOL and USDC only, so a route through any other mid token creates that token's account and closes it to the payer
#     in the same atomic transaction (rent-neutral: a failed route reverts the create too). The canary is no longer
#     USDC-only; [live] max_new_token_accounts is gone. The size budget's held-set additions (create, no close) are off
#     ([builder] held_max = 0: nothing stays locked); WP-07's rent cap ([supervisor] rent_cap_sol) limits only those
#   - the builder (WP-06): the tip is [tips] by band, 0.7 of the edge in every band within 1,000-100,000 lamports (the
#     status quo; the jito-bundle path keeps its 1,000 floor), the CU limit from data/cu-table.json (it must be on Cherry
#     at /root/arbx/data/cu-table.json: a run without it refuses to start), the loaded-data limit "auto"; the dry run
#     simulates its bundles ([dry_run] simulate = true, FT-002: the venue harness cannot check "auto", which simulation does)
#   - frz's PumpSwap user volume accumulator already exists (CUiyUSbx..., 1,346,200 lamports): no non-recoverable rent is
#     needed for PumpSwap routes; the snapshots read it (owned, not recoverable)
#   - the five dead feeds (OD-6: raiden, corvus, getblock, constantk-prism, erpc; 0 transactions or refused in FT-000) are
#     disabled
#   - the old wallet's durable nonces ([send_policy.direct]) are left out: they belong to 2g7rYv7y...
# Check it with `arbx check --config deploy/arbx-canary-frz.toml` (CI: tests/campaign.rs the_frz_canary_config_passes_arbx_check).
#
# Running it on Cherry (only the binary, this file and its data files go there: docs/field-tests/README.md):
#   arbx grpc-probe --config deploy/arbx-canary-frz.toml                       (once; Haan alone: arb-lab not running, I-3)
#   arbx campaign --name ft004 --config deploy/arbx-canary-frz.toml --mode canary --hours 1 --segment-min 30 \
#       --who <you> --detach                                                   (FT-004: <= 0.005 SOL, this file's allotment)
#   arbx campaign --name ft005 --config <a copy with test_budget_lamports = 10000000> --mode canary --hours 24 \
#       --segment-min 60 --who <you> --detach                                  (FT-005: <= 0.01 SOL)
#   controls: touch /root/arbx/runs/<name>.pause | .next | .stop (a reason inside); money: arbx campaign-equity --campaign-dir
#   /root/arbx/runs/<name>; BUDGET.md's row: /root/arbx/runs/<name>/spend.json `budget_md_row`
# WP-01: the config format (required; arb-lab's v1 files do not load, and every unknown key is an error)
config_version = 2
out_dir = "/root/arbx/runs"
mode = "shadow"   # a canary is `--canary` with [canary] enabled (a plain run records only); "live" is the later $500 stage
# the production wallet frz (owner, 2026-10-05): the owner's existing keystore on Cherry, used in place
wallet = "FRZh63L6L8m3MEPwHVimRkWPzwSgizr22Z6wvpWTyTWS"
wallet_profile = "trading"   # ~/.nexus-v2-trading-wallet.{enc,pass}: no passphrase step
wallet_keystore = ""

[pools]
# OD-4 (owner confirms the seed list): the live w5h3 campaign's list (exp3 list + fresh discovery, 2026-10-03 evening),
# copied from Cherry into arbx/data (commit c777f26). The fallback named by PLAN.md WP-00 is data/seed-pools-merged.csv
seed_csv = "/root/arbx/data/seed-pools-20261006.csv"   # refreshed 2026-10-06 14:57 UTC (owner request): 1,165 kept (771 active in FT-004/FT-005 first) + 335 new pooldisco discoveries; 335 idle dropped
registry_json = "/root/arbx/data/registry.json"
registry_all = true
templates_json = "/root/arbx/data/templates.json"

# Every RPC call is raced across all providers below; the first good answer is used and each one is timed.
# Providers whose environment variables are missing are skipped (listed in run.log).
[rpc]
# 2026-10-03: Haan first, Shyft only if Haan fails (racing every call to all providers rate-limited all of them:
# 15% of reads failed everywhere). Helius expired; the public RPC and ERPC (dead key) refused nearly everything.
failover = true

[[rpc.endpoint]]
name = "haan"
url = "https://rpc.haandigital.eu/"
bearer_env = "HAAN_API_KEY"

[[rpc.endpoint]]
name = "shyft"
url_env = "SHYFT_RPC_URL"

[[rpc.endpoint]]
name = "public"
url = "https://api.mainnet-beta.solana.com"
enabled = false

[[rpc.endpoint]]
name = "helius"
url_env = "RMR_RPC_URL"
enabled = false

[[rpc.endpoint]]
name = "erpc"
url = "https://edge.erpc.global?api-key=${ERPC_RPC_TOKEN}"
enabled = false

[state]
url = "https://grpc.haandigital.eu:443"
token_env = "HAAN_X_TOKEN"
# WP-03: the state stream also follows the Clock sysvar, the route and venue programs' programdata accounts, and the
# wallet with its token accounts (every landed transaction we pay for writes the wallet: its txn names it)
watch_clock = true
watch_programdata = true
watch_wallet = true
slot_statuses = "auto"  # "all" (processed, confirmed, finalized + first-shred, completed, created-bank, dead) where the probe accepted slots_interslot, else "commitment"
block_meta = "auto"     # on only if `arbx grpc-probe --config deploy/arbx-stage0.toml` accepted it (<out_dir>/probe.json); run the probe before WP-05
# probe_file = ""       # default <out_dir>/probe.json, where `arbx grpc-probe` writes it

# WP-04: state consistency (the plan's defaults, written out). Commit groups: a known write set waits at most
# commit_timeout_ms for its members; an unknown one resolves after quiescence_ms without updates (3 ms is a placeholder:
# arb-lab's moves logs show 0.38-0.63 ms p99.9 across one transaction's pools); readiness: consistency-set skew, tip lag
commit_timeout_ms = 5
quiescence_ms = 3
max_part_skew_slots = 2
max_tip_lag_slots = 2
clock_max_age_slots = 2   # DLMM / DAMM v2 are priced on the Clock sysvar; refused (clock_stale) past this
lag_slo_p50_ms = 16       # first shred of T to T's complete commit, every minute
lag_slo_p90_ms = 30
lag_slo_breach_minutes = 5
slo_action = "log"        # Stage 0: breaches are recorded only (F32)
slo_recover_minutes = 10
tier_a_grace_s = 60       # a pool whose parts are still missing after this leaves Tier A (the warm-up gate)
# PLAN-ADDENDUM I-4: stop (state_unavailable, exit 30) if the state stream delivers nothing within boot_timeout_s; price
# and send nothing while it is down or its newest message is older than max_update_age_ms; read every account again
# after the stream's first connection and every reconnection (review WP-04 #1: the gate is `resync`, and a pool with a
# part not read again is refused, until the re-read lands; a WARNING after resync_warn_s; a chunk still failing
# resync_give_up_s after the start is given up, its accounts staying refused until the stream writes them)
boot_timeout_s = 60
max_update_age_ms = 2000
resnapshot = true
resync_warn_s = 10
resync_give_up_s = 300
unavailable_stop_s = 0    # review WP-04 #10, owner decision: stop (state_unavailable) after this long unavailable; 0 never

# WP-03 item 3: the executed-transaction stream (arb-lab's `haan-grpc` [[feed]]; it runs as a feed after the [[feed]] list,
# so its feed id is unchanged). Haan's plan allows 1 transaction filter with 1 account: PumpSwap (the busiest venue).
# A second filter or provider covering the other venues is owner decision OD-1 (config only: another entry here)
[[state.tx_stream]]
name = "haan-grpc"
# url and token_env: the [state] stream's
account_include = ["pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA"]
failed = true       # failed PumpSwap transactions too (exec.jsonl `ok` false)
max_accounts = 1    # the provider's limit (an include list longer than this refuses to start)

# WP-03 item 10: the LeaderBook's leader kinds (jito / bam / other) and the dated fallback
[leaders]
validator_lists = ["https://kobe.mainnet.jito.network/api/v1/validators"]   # Cherry's address may be refused (403): then the fallback
static_fallback = "/root/arbx/data/validators-meta.json"
refresh_min = 60
# WP-08: host -> leader TPU-QUIC RTT (a QUIC handshake, no data) to the endpoints the leaders of the next 64 slots
# announce, once per endpoint (BAM / Harmonic ingress nodes serve many validators), at most 2 a second; a validator whose
# endpoint refuses takes the median of its endpoint region's (region_bucket). Places (city, metro region) from the table
rtt_probe = true
rtt_per_sec = 2
geo_table = "/root/arbx/data/ip-geo.csv"

# WP-03b: chain fetch (our wallet's transactions, the watched-transaction backfill, the slot index, the blockhash ring)
# and every RPC provider's request budget. A provider's max_rps is a token bucket for the whole process: the boot, the
# executor, the engine's lookup-table fetches and re-snapshots, the LeaderBook and chain fetch all share it (Haan
# answered 429 at about 5 requests/s, sequential: tools/rpc_latency.py, 2026-10-04; two bots got 597-698 Haan 429s in
# cmp2's 28 minutes). Tokens go by priority, and a waiting caller is never overtaken by a later or lower one: boot /
# snapshot / exec first, then engine / leaders / wallet, then the slot index / coverage sample / blockhash poll, then
# the backfill, which runs at what its providers have spare after the others (status chainfetch.cap_rps_now). With
# this split the slot index (about 3.7 getBlock/s) takes most of Shyft, the poll is skipped while the slot index's
# confirmed hashes are fresh, and the backfill gets about 3.9/s, nearly all on Haan (test
# the_slot_index_keeps_up_while_the_backfill_has_demand, P1's load), against the 16-35/s that non-PumpSwap watched
# transactions need (PLAN §0): status.jsonl chainfetch.need_rps_now against have_rps_now shows the shortfall, and OD-1
# decides the capacity. Our attempts' signatures cost one getSignatureStatuses every 2 s while any is in flight
[chainfetch]
after_ms = 1500          # a watched transaction this long without an exec.jsonl record is backfilled
rps = "auto"             # the backfill: 1.25 x the uncovered rate (1-minute EWMA), capped by its providers' max_rps
max_backlog = 200000
sample_every_s = 60      # one full block a minute: the share of watched transactions no source reported
blockhash_poll_ms = 400  # getLatestBlockhash (confirmed), only while no other source gave a fresh confirmed blockhash
sigs_every_s = 3600      # getSignaturesForAddress(wallet) over the last hour
default_max_rps = 0      # no bucket for an [rpc] provider not listed below
boot_retry_s = 90        # PLAN-ADDENDUM I-1: at boot a call retries with backoff across the providers this long
max_tx_version = 1       # mainnet blocks carry v1 transactions: with 0 a provider refuses the whole block (-32015)

[[chainfetch.provider]]
name = "haan"
roles = ["wallet", "blockhash", "backfill"]
max_rps = 4
reserve = { backfill = 0.5 }   # FT-000 S1-1: 2/s of Haan's 4 for the backfill, whatever the busier roles ask (it got 4 fetches in 30 min)

[[chainfetch.provider]]
name = "shyft"
roles = ["slotidx", "sample", "backfill", "wallet"]
max_rps = 4
reserve = { slotidx = 0.95 }   # FT-000 S1-1: 3.8/s of Shyft's 4 for the slot index (one getBlock a confirmed slot, 3.7/s; it fell 3,005 slots behind)

[strategy]
# WP-04: decoded swaps are hints only (their write set goes to the CommitTracker, their predictions to the accuracy
# monitor); `confirm_trigger_ms` and `decoded_sends` are gone (there is no decoded send path: a config with them does not load)
skip_failing_signers = true   # WP-00: stopgap (R §4 day 0); live had false. With hints never priced it only drops their accuracy check
state_triggers = true   # price on committed state (complete commit groups): the only path that prices and sends
budget_caps_sol = [0.165, 2.1, 4.2, 8.4, 21.0, 42.0, 84.0]   # EXP-4: $20, $250, $500, $1k, $2.5k, $5k, $10k at SOL $119: the best round trip at each budget (recorded, not traded)
signer_stats_file = "/root/arbx/runs/signer-stats.json"   # read at start, never written (I-5): each segment writes signer-stats.json and signer-stats-delta.json into its run dir; `arbx signer-stats merge` folds deltas back
sizes_sol = [0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2]   # FT-007's small rungs + 0.1 and 0.2 for the 0.2 size arm ([experiments.size] caps each decision's search)
# record every round trip that clears base + priority fee; the report applies each send path's tip
min_profit_lamports = 1
cu_price_micro = 40000
outcome_watch_ms = 2000

