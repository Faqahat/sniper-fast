# arb-lab on Cherry (84.32.59.15), shadow mode: every feed still live, MriyaNN8's pools + all of ours.
# WP-01: the config format (required; every unknown key is an error)
config_version = 2
out_dir = "/root/arb-lab/runs"
mode = "shadow"
# the trading wallet (arbed's keystore ~/.nexus-v2-trading-wallet.*; owner of the WSOL account and the nonce accounts)
wallet = "FRZh63L6L8m3MEPwHVimRkWPzwSgizr22Z6wvpWTyTWS"

[pools]
seed_csv = "/root/arb-lab/data/seed-pools-merged.csv"   # old list + mriya v5 (owner, 2026-10-03)
registry_json = "/root/arb-lab/data/registry.json"
registry_all = true
templates_json = "/root/arb-lab/data/templates.json"

# Every RPC call is raced across all providers below; the first good answer is used and each one is timed.
# Providers whose environment variables are missing are skipped (listed in run.log).
[rpc]

[[rpc.endpoint]]
name = "public"
url = "https://api.mainnet-beta.solana.com"

[[rpc.endpoint]]
name = "helius"
url_env = "RMR_RPC_URL"

[[rpc.endpoint]]
name = "shyft"
url_env = "SHYFT_RPC_URL"

[[rpc.endpoint]]
# dropped for now (owner, 2026-10-03): a 60/min send plan; reads kept it rate-limited (12,116 of 12,116 failed in shadow-4)
name = "rpcfast"
url_env = "LANDER_RPCFAST_URL"
enabled = false

[[rpc.endpoint]]
name = "haan"
url = "https://rpc.haandigital.eu/"
bearer_env = "HAAN_API_KEY"

[[rpc.endpoint]]
name = "erpc"
url = "https://edge.erpc.global?api-key=${ERPC_RPC_TOKEN}"

[state]
url = "https://grpc.haandigital.eu:443"
token_env = "HAAN_X_TOKEN"
# WP-03 (the defaults, written out): clock, programdata and wallet accounts on the stream; the interslot slot statuses
# and block meta if `arbx grpc-probe` accepted them
watch_clock = true
watch_programdata = true
watch_wallet = true
slot_statuses = "auto"
block_meta = "auto"

# Haan's plan allows 1 transaction filter with 1 account: PumpSwap (the busiest venue). WP-03: a [[state.tx_stream]]
# (it runs as a feed after the [[feed]] list)
[[state.tx_stream]]
name = "haan-grpc"
account_include = ["pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA"]
max_accounts = 1

[strategy]
sizes_sol = [0.02, 0.05, 0.1, 0.2, 0.5, 1.0]
# record every round trip that clears base + priority fee; the report applies each send path's tip
min_profit_lamports = 1
cu_price_micro = 40000
outcome_watch_ms = 2000
# WP-00: decoded swaps are hints only now ([strategy] decoded_sends defaults to false), so the confirmed pool moves
# are the pricing path. Without this line this config found no opportunity at all (review F3)
state_triggers = true

