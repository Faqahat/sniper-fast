# (the PumpSwap transaction stream `haan-grpc` is a [[state.tx_stream]] since WP-03)

# ---------------------------------------------------------------- send paths
# Checked with `arbx senders --config arb.toml` (sends nothing). The engine does not send (shadow only): its executor
# runs every send check up to the signature and records would-sends (WP-05, PLAN-ADDENDUM I-7); the other enabled
# paths only keep their connections warm (keep-alive measurement). A live or canary run is bundle-only (WP-05).
# Secrets come from .env next to this file; `${NAME}` in a url is replaced from it. Tip accounts default to each
# provider's documented list (src/send/mod.rs known_tip_accounts). Tips are paid only when the trade lands.
# PLAN-ADDENDUM I-10: an enabled path carries a secret over plain http:// only with `no_tls_endpoint` (none here).
# The Jito gate ([gate]) is gone with WP-05.

[[send]]
# one-transaction bundle through the searcher gRPC; auth key = the whitelisted keypair (CrQx62…EynE), never funded
name = "jito-bundle"
kind = "jito-bundle"
url = "https://frankfurt.mainnet.block-engine.jito.wtf"
auth_keypair = "~/.nexus-v2-jito-auth.json"
tip_lamports = 10000          # floor
tip_share = 0.7               # 70% of the predicted edge after the base fee (WP-00: aligned with the live config, R §3.6)
tip_max_lamports = 100000     # owner 2026-10-04: bundle tips capped at 0.0001 SOL (WP-00: aligned with the live config)
max_per_sec = 5               # Jito's limit on our gRPC key since 2026-10-02 (per key: arbx gets its own key at go-live)

[[send]]
# Shyft staked RPC (SWQoS), no tip. Frankfurt host, e.g. https://rpc.fra.shyft.to?api_key=...
name = "shyft"
kind = "shyft"
url = "${LANDER_SHYFT_URL}"

[[send]]
name = "helius"
kind = "helius"
url = "http://fra-sender.helius-rpc.com/fast?swqos_only=true"
tip_lamports = 5000           # the swqos_only minimum; Sender Max (no swqos_only) wants 1,000,000

[[send]]
# RPC Fast Beam: key in the URL (.env); tip to Beam's Astralane accounts; Start plan 60/min. Dropped for now.
name = "rpcfast"
kind = "rpcfast"
enabled = false
url = "${LANDER_RPCFAST_URL}"
tip_lamports = 10000
max_per_sec = 1

[[send]]
# Jito JSON-RPC sendTransaction with our UUID (2/s). Add ?bundleOnly=true for revert protection.
name = "jito-tx"
kind = "jito-tx"
enabled = false
url = "https://frankfurt.mainnet.block-engine.jito.wtf/api/v1/transactions"
token_env = "JITO_UUID"
tip_lamports = 5000
max_per_sec = 2

[[send]]
# Haan Sender trial: 1 tx/s, no tip
name = "haan"
kind = "haan"
enabled = false
url = "https://sender.haandigital.eu/api/v1/transactions"
token_env = "HAAN_API_KEY"
jito_auth_env = "JITO_UUID"
max_per_sec = 1

[[send]]
# Astralane Iris (binary). The key is mandatory on every tier: the account key (same as the shred feed's) works
# (2026-10-03 probe: no key -> 401). Free tier: 0.001 SOL minimum tip, 5 tx/s, no bundles; 10,000 lamports at VIP 3
name = "astralane"
kind = "iris"
url = "https://fr.gateway.astralane.io/irisb?api-key=${ASTRALANE_KEY}&method=sendTransaction"   # I-10: TLS ("you can also use HTTPS on the above endpoints", astralane.gitbook.io low-latency/endpoints-and-configs, 2026-10-04)
tip_lamports = 1000000
max_per_sec = 5

[[send]]
# Raiden Bolt: free tier 5 tx/s, 0.001 SOL minimum tip (key accepted, 2026-10-03 probe)
name = "bolt"
kind = "bolt"
url = "https://fra.bolt.raiden.wtf/api/v1/sendRawTransaction"
token_env = "RAIDEN_BOLT_KEY"
tip_lamports = 1000000
max_per_sec = 5

[[send]]
# Hello Moon Lunar Lander (binary): 0.001 SOL minimum tip
name = "lunar"
kind = "lunar"
enabled = false
url = "http://fra.lunar-lander.hellomoon.io/send-bin?api-key=${LUNAR_KEY}"
tip_lamports = 1000000

# ---------------------------------------------------------------- steps 1-3 of the send plan
# step 1 (keep-alives) runs whenever send paths are enabled; steps 2 and 3 below.
[exec]
program = "8K8uyQDtVKHYRPACP9fepz91q4sEZLBppR2Ty4vdXuWg"
rpc = ["helius"]          # simulation, signature statuses, landed transactions: one provider, not the race
max_size_sol = 0.165      # the wallet's WSOL covers this
keepalive_s = 30
# WP-01: the deployed 8K8uyQDt ELF (testdata/programs/README.md); a live or canary run whose program differs does not send
expected_program_sha256 = "e4f03590bda38d95b884f56a1192070f7e34320840a6d89a568c6ed6024bae2f"
expected_program_md5 = "809315befcb9554211f8019bf9df290b"

# WP-01: <run dir>/control.sock (`arbx ctl`)
[control]
socket = true

[sim]
# step 2, free: every would-send decision is built and simulated (sims.jsonl)
enabled = true
max_per_sec = 2

[canary]
# WP-05: a canary run is a live run under these caps (`arbx run --canary`, bundle-only): at most size_sol a trade
enabled = true
count = 100
every_ms = 5000
size_sol = 0.01
max_spend_lamports = 3000000   # 0.003 SOL of fees of landed failures in all

[live]
# step 4: real trades; needs mode = "live" AND `arbx run --live` (bundle-only: WP-05)
max_size_sol = 0.165                # about $20 a trade (owner, 2026-10-03), paid from the wallet's WSOL
max_failed_fees_lamports = 20000000 # stop after 0.02 SOL of fees on landed transactions that failed
margin_lamports = 1000              # the decision's bar: expected profit >= tip + base fee + this
max_new_token_accounts = 5          # rent of new token accounts (recoverable)

[send_policy]
# PLAN WP-05 (the defaults, written out): fail-closed send checks, the in-flight lock, the rate queue, the on-chain margin
max_blockhash_age_slots = 20
blockhash_commitment = "confirmed"
skip_leader_kinds = ["other", "unknown"]
inflight_hold_slots = 2
queue_ms = 10
big_band_max_per_sec = 0.5
crowding_window_h = 6
crowding_buckets = [20, 150]
margin_floor = 1
margin_share = 0.0

[send_policy.direct]
# the direct arm's durable nonces, kept for its experiment only (direct_experiment is refused in Stage 0)
nonce_accounts = ["58XHXCVwizLunHZdtXRr21NXnraG8Y4vQWjpXLN2FgVe", "G6MfymxNMNSBResfcJccuvwQMswPW8cq7nB1tsCUN2DC", "CK9tCKm9PNt7Smrymh87UG6PyPi8XmV4gmV3BCPtxJdM"]

