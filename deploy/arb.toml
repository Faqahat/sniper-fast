# arbx all-feeds shadow config on Cherry (84.32.59.15), shadow mode: every feed still live, MriyaNN8's pools + all of ours.
# WP-01: the config format (required; every unknown key is an error)
config_version = 2
out_dir = "/root/arbx/runs"
mode = "shadow"
# the trading wallet (the owner's encrypted keystore, owner-managed; owner of the WSOL account and the nonce accounts)
wallet = "FRZh63L6L8m3MEPwHVimRkWPzwSgizr22Z6wvpWTyTWS"

[pools]
seed_csv = "/root/arbx/data/seed-pools-merged.csv"   # old list + mriya v5 (owner, 2026-10-03)
registry_json = "/root/arbx/data/registry.json"
registry_all = true
templates_json = "/root/arbx/data/templates.json"

# Every RPC call is raced across all providers below; the first good answer is used and each one is timed.
# Providers whose environment variables are missing are skipped (listed in run.log).
[rpc]

[[rpc.endpoint]]
name = "public"
url = "https://api.mainnet-beta.solana.com"

[[rpc.endpoint]]
name = "helius"
url_env = "RMR_RPC_URL"

[[rpc.endpoint]]
name = "shyft"
url_env = "SHYFT_RPC_URL"

[[rpc.endpoint]]
# dropped for now (owner, 2026-10-03): a 60/min send plan; reads kept it rate-limited (12,116 of 12,116 failed in shadow-4)
name = "rpcfast"
url_env = "LANDER_RPCFAST_URL"
enabled = false

[[rpc.endpoint]]
name = "haan"
url = "https://rpc.haandigital.eu/"
bearer_env = "HAAN_API_KEY"

[[rpc.endpoint]]
name = "erpc"
url = "https://edge.erpc.global?api-key=${ERPC_RPC_TOKEN}"

[state]
url = "https://grpc.haandigital.eu:443"
token_env = "HAAN_X_TOKEN"
# WP-03 (the defaults, written out): clock, programdata and wallet accounts on the stream; the interslot slot statuses
# and block meta if `arbx grpc-probe` accepted them
watch_clock = true
watch_programdata = true
watch_wallet = true
slot_statuses = "auto"
block_meta = "auto"
# WP-04 (the defaults, written out): commit groups, readiness, the lag SLO (log only), the state-health gate (I-4)
commit_timeout_ms = 5
quiescence_ms = 3
max_part_skew_slots = 2
max_tip_lag_slots = 2
clock_max_age_slots = 2
slo_action = "log"
boot_timeout_s = 60
max_update_age_ms = 2000
resnapshot = true

# Haan's plan allows 1 transaction filter with 1 account: PumpSwap (the busiest venue). WP-03: a [[state.tx_stream]]
# (it runs as a feed after the [[feed]] list)
[[state.tx_stream]]
name = "haan-grpc"
account_include = ["pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA"]
max_accounts = 1

# WP-03b: chain fetch and the providers' request budgets (each a token bucket for the whole process; the race spends
# one token on every provider per call). The keys are the plan's defaults, written out; see deploy/arbx-stage0.toml
[chainfetch]
after_ms = 1500
rps = "auto"
max_backlog = 200000
sample_every_s = 60
blockhash_poll_ms = 400
sigs_every_s = 3600
default_max_rps = 0      # no bucket for the providers not listed below (public, helius, erpc), as before WP-03b
boot_retry_s = 90
max_tx_version = 1

[[chainfetch.provider]]
name = "haan"
roles = ["wallet", "blockhash", "backfill"]
max_rps = 4

[[chainfetch.provider]]
name = "shyft"
roles = ["slotidx", "sample", "backfill", "wallet"]
max_rps = 4

[strategy]
sizes_sol = [0.02, 0.05, 0.1, 0.2, 0.5, 1.0]
# record every round trip that clears base + priority fee; the report applies each send path's tip
min_profit_lamports = 1
cu_price_micro = 40000
outcome_watch_ms = 2000
# decoded swaps are hints only (WP-00, WP-04), so committed state is the only pricing path. Without this line this
# config finds no opportunity at all (review F3)
state_triggers = true

