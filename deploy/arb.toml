[record]
# WP-02: always on; these keys only set budgets (defaults shown)
archive_feeds = []
rivals_venues_sample = 10   # WP-08 (plan addendum I-9): 1 in 10 rivals.jsonl `why = venues` rows, by signature; 1 keeps all
disk_budget_gb = 40
min_free_gb = 25

[runtime]
# WP-02: the background runtime for every RPC call
bg_threads = 3

[alts]
# WP-04 / I-6: lookup-table fetches retried (never cached as missing), capped, the previous segment's tables preloaded
max_inflight = 16
preload = "auto"

[accuracy]
# WP-04: hint accuracy against the pre-state; log only in Stage 0
action = "log"
ring_versions = 8

[supervisor]
# WP-07: a shadow config records what the equity stops would do (a shadow run never acts on them); no test budget
test_budget_lamports = 0
