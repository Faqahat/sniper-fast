[builder]
# WP-06: a token account the wallet holds none of is created and closed in the same transaction (rent-neutral); the held
# set is WSOL, USDC, USDT and the tokens the wallet already holds
create_close = true   # false: trade held tokens only (mid_not_held), the held-only control arm
held_max = 0   # the size budget's held-ATA fallback (create, no close: 1.49-1.51M lamports stay locked per account) is OFF (go-live gate item 2; review WP-06 #1). An explicit opt-in above 0: at most this many hot mints, each kept only when the expected profit covers min_profit + its rent
allow_uva_create = false   # a PumpSwap buy without the wallet's volume accumulator would create it (1,346,200 lamports, never recovered): refused (uva_missing); owner action
loaded_data_limit = "auto" # the transaction's accounts and programs at their measured sizes, +25% +256 KiB (the dry run's simulation checks it)
cu_table = "/root/arbx/data/cu-table.json"   # measured CU per leg (arbx-report cu-table); a cell under cu_min_samples takes the old formula
cu_min_samples = 30
alt_index = true   # over 1,232 bytes: lookup tables learned from decoded transactions that name the route's pools, at most max_alts
max_alts = 4
payer_guard = false   # nexus-v2's max_payer_lamport_drop trailer: on after X6 and a canary
payer_guard_max_drop = 0

[dry_run]
# go-live gate item 4 (`arbx run --dry-run`): every would-send bundle is signed by a throwaway key made in memory (never
# the trading keystore; the payer stays the wallet, so the signature cannot pass on chain), recorded in full
# (attempts.jsonl `dry_run`: the transaction, its size, tip, accounts and checks) and never sent; no send path is built
simulate = false   # true: also a read-only simulateTransaction (sigVerify off, the blockhash checked), at most max_sim_per_sec
max_sim_per_sec = 2

