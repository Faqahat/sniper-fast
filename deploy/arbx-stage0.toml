[record]
# WP-02: the recorder is always on (MEASUREMENT §0-§1): every stream is zstd-compressed in-process into
# <stream>.NNN.<ext>.zst (frames every flush_ms, readable while the run goes on), rotated, with a manifest.json; the
# small streams (status, events, feedhealth, resources, keepalive, run.log) stay plain. These keys only set budgets.
# No raw entries archive until an entries feed is alive (erpc and constantk-prism delivered 0 in p12)
archive_feeds = []
disk_budget_gb = 40     # per segment; past 90% of it the disk ladder stops entries, rivals, then lengthens accounts keyframes; past it: shadow + stop
min_free_gb = 25        # the same two stages on free space (under 25 / 0.9 GB, then under 25 GB); a run does not start under it
rotate_mb = 256
rotate_min = 60
flush_ms = 1000
zstd_level = 3
queue_max_mb = 1024     # each bounded recorder queue's byte cap (declared payloads: binary records, the entries archive)

[runtime]
# WP-02: RPC runs on its own runtime (arbx-bg, niced +5), apart from the state stream, feeds and sends (arbx-hot, 2)
bg_threads = 3

