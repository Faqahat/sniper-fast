[record]
# WP-02: the recorder is always on (MEASUREMENT §0-§1): every stream is zstd-compressed in-process into
# <stream>.NNN.<ext>.zst (frames every flush_ms, readable while the run goes on), rotated, with a manifest.json; the
# small streams (status, events, feedhealth, resources, keepalive, run.log) stay plain. These keys only set budgets.
# No raw entries archive until an entries feed is alive (erpc and constantk-prism delivered 0 in p12)
archive_feeds = []
# WP-08 (plan addendum I-9): rivals.jsonl keeps 1 in 10 of its `why = venues` rows (88% of cmp2's 1.3 GB/h raw), chosen by
# the signature (a replay keeps the same ones); each kept row carries `sample` {one_in, kept, seen}. 1 keeps every row
rivals_venues_sample = 10
disk_budget_gb = 40     # per segment; past 90% of it the disk ladder stops entries, rivals, then lengthens accounts keyframes; past it: shadow + stop
min_free_gb = 25        # the same two stages on free space (under 25 / 0.9 GB, then under 25 GB); a run does not start under it
rotate_mb = 256
rotate_min = 60
flush_ms = 1000
zstd_level = 3
queue_max_mb = 1024     # each bounded recorder queue's byte cap (declared payloads: binary records, the entries archive)

[runtime]
# WP-02: RPC runs on its own runtime (arbx-bg, niced +5), apart from the state stream, feeds and sends (arbx-hot, 2)
bg_threads = 3

[alts]
# WP-04 item 7 / PLAN-ADDENDUM I-6: a failed lookup-table fetch is retried (50 ms, 250 ms, 1 s, 5 s, then every 30 s)
# and given up after 10 minutes, never cached as missing for the run; at most max_inflight tables being fetched at once;
# transactions wait for their tables (at most wait_cap); the newest sibling segment's alts-final is preloaded: the tables
# a transaction used in the last preload_max_age_h hours, at most preload_max_tables (review WP-04 #11: the set no
# longer grows per segment)
retry_ms = [50, 250, 1000, 5000]
retry_every_s = 30
give_up_s = 600
wait_cap = 10000
max_inflight = 400       # FT-000 S1-1: tables, not requests: they go batch_max to a getMultipleAccounts (16 one-table requests took 76% of the RPC budget)
batch_max = 100
calls_inflight = 2
call_every_ms = 500      # at most a request every 500 ms unless its batch is full: about 2/s at FT-000's 6 new tables a second
max_tables = 20000       # FT-000 S1-4: the cache is bounded (LRU; evictions journaled, an evicted table fetched again when needed);
max_mb = 192             # FT-000's 30 minutes held 19,143 tables (104 MB at their own length), 300-350 more a minute
preload = "auto"
preload_max_age_h = 24
preload_max_tables = 5000

[accuracy]
# WP-04 item 13: hints scored against their transaction's pre-state (the 8-version rings); log only in Stage 0 (OD-8)
action = "log"
ring_versions = 8
queue = 10000

