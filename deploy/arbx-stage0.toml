# ---------------------------------------------------------------- send paths
# Checked with `arbx senders --config arbx-stage0.toml` (sends nothing). Stage 0 sends one-transaction Jito bundles only:
# every other path below is disabled (WP-00).
# Secrets come from .env next to this file; `${NAME}` in a url is replaced from it. Tip accounts default to each
# provider's documented list (src/send/mod.rs known_tip_accounts). Tips are paid only when the trade lands.
# Same order as arbed's production LANDERS (jito-bundle,shyft,helius,rpcfast); the bundle must stay first for the gate.

# THE JITO GATE (arbed's Run 2 decision: keep it): the bundle goes first; the paid copies are dropped only when Jito
# says our own profit check (0x4e580002) would fail, within 25 ms. Every 10th skip is sent anyway (canary).
[gate]
# OFF for live-run-2 (owner, 2026-10-03): every paid copy goes out without waiting for Jito's verdict
enabled = false
wait_ms = 25
canary_every = 10

[[send]]
# one-transaction bundle through the searcher gRPC; auth key = the whitelisted keypair (CrQx62…EynE), never funded
name = "jito-bundle"
enabled = true   # WP-00: the only enabled send path
kind = "jito-bundle"
url = "https://frankfurt.mainnet.block-engine.jito.wtf"
auth_keypair = "~/.nexus-v2-jito-auth.json"
tip_lamports = 1000   # EXP-1: floor; the bundle-only bots tip 1,000-6,000
tip_share = 0.7               # 70% of the predicted edge after the base fee (live value)
tip_max_lamports = 100000   # owner 2026-10-04: bundle tips capped at 0.0001 SOL (70% share below that)
max_per_sec = 5               # Jito's limit on our gRPC key since 2026-10-02 (shared with arbed if it runs on this key)
# no queue_ms (0: over the rate a bundle is refused at once, as in arb-lab). WP-00 review F2: a 10 ms queue reordered
# no send in the legacy replay (two bundles almost never wait at once) and only added delay. WP-05 brings [send] queue_ms

