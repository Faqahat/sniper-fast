# arbx Stage 0, day 0 (docs/PLAN.md WP-00 "Day-0 safety switch"): derived from deploy/legacy/arb-w-live.toml, the config arb-lab
# last ran live on Cherry (84.32.59.15). What changed, and why (R §4 "Day 0, config only"; W §2; R §1):
#   - bundle-only: every non-bundle [[send]] path is disabled (the direct arm: 1 win in 989 attempts, 24.4M lamports of
#     fees); since WP-05 the executor sends one-transaction bundles only, and a live config with another path enabled
#     does not load
#   - no sends on decoded triggers (WP-00; since WP-04 decoded swaps are hints only, and prices come only from committed,
#     complete, canonical state: commit groups, readiness, forks, the state-health gate; [state] WP-04 keys, [alts], [accuracy])
#   - bundles expecting 1M or more throttled to 0.5/s; crowded pools ranked last and kept out from 100k expected
#     (OD-3's alternative); since WP-05 in [send_policy] with the rest of the send policy (fail-closed send checks, the
#     in-flight lock, the rate queue's bands and crowding, the on-chain margin)
#   - no rent locked by a trade: WP-06 creates a token account the wallet holds none of and closes it in the same
#     transaction (rent-neutral; [live] max_new_token_accounts, WP-00's 0, is gone: rent turned the bundle arm's +163k
#     into -17.9M); the size budget's held-set additions are off ([builder] held_max = 0: nothing stays locked)
#   - the recorder on (WP-02: always on, [record] only sets budgets); skip_failing_signers on; the sim gate and the
#     durable nonces are gone (WP-05: a recent blockhash; attempts settle from the chain)
#   - paths repointed to the arbx tree (/root/arbx)
# Check it with `arbx check --config deploy/arbx-stage0.toml`: only jito-bundle is enabled.
#
# Owner procedure (WP-00 field acceptance; review F1). The file ships in shadow, so neither run needs an edit:
#   1. arbx run --config deploy/arbx-stage0.toml --minutes 10 --name wp00-shadow-rec      (recorder on)
#   2. (WP-00 only) the same run with --no-record; WP-02 removed that flag: recording cannot be turned off, and the
#      recorder-on/off comparison is the offline engine benchmark (rec::tests, `engine_benchmark_recorder_on_off`)
#   3. once both pass: set mode = "live" below (note it in the merge note), then `arbx run ... --live`.
#      `--shadow` runs the live file in shadow again (meta.json `overrides`), e.g. for WP-02's baseline comparison.
#   The send checks run in every run (PLAN-ADDENDUM I-7): a shadow run records its would-sends with sent = false, and
#   `arbx run --dry-run` also signs them with a throwaway key and records them in full, never sending (go-live gate
#   item 4). Offline tests: src/exec/tests.rs.
# Campaigns (WP-01): deploy/run-w.sh <campaign> <hours> <segment min> <fee budget lamports> deploy/arbx-stage0.toml <you>
#   freezes the binary and this file into runs/<campaign>/ and never edits them (the budget goes as --budget-left);
#   control it with runs/<campaign>.pause | .next | .stop (a reason inside), a segment with `arbx ctl --run <dir> ...`.
# WP-01: the config format (required; arb-lab's v1 files do not load, and every unknown key is an error)
config_version = 2
out_dir = "/root/arbx/runs"
mode = "shadow"   # WP-00: shadow until the two shadow runs above pass (review F1); the owner sets "live" then
# the trading wallet (the owner's encrypted keystore, owner-managed; owner of the WSOL account and the nonce accounts)
wallet = "2g7rYv7yCQuNsxUfr5B61LBfkhYzHMhYTZkcZ6e2iTLE"   # NEW trading wallet (2026-10-03), encrypted keystore, passphrase given at start
wallet_keystore = "/root/arbx/wallets/trading.enc"   # the owner's encrypted keystore (not a repo file): the owner places it here at go-live (I-11)

[pools]
# OD-4 (owner confirms the seed list): the live w5h3 campaign's list (exp3 list + fresh discovery, 2026-10-03 evening),
# copied from Cherry into arbx/data (commit c777f26). The fallback named by PLAN.md WP-00 is data/seed-pools-merged.csv
seed_csv = "/root/arbx/data/seed-pools-w4.csv"
registry_json = "/root/arbx/data/registry.json"
registry_all = true
templates_json = "/root/arbx/data/templates.json"

# Every RPC call is raced across all providers below; the first good answer is used and each one is timed.
# Providers whose environment variables are missing are skipped (listed in run.log).
[rpc]
# 2026-10-03: Haan first, Shyft only if Haan fails (racing every call to all providers rate-limited all of them:
# 15% of reads failed everywhere). Helius expired; the public RPC and ERPC (dead key) refused nearly everything.
failover = true

[[rpc.endpoint]]
name = "haan"
url = "https://rpc.haandigital.eu/"
bearer_env = "HAAN_API_KEY"

[[rpc.endpoint]]
name = "shyft"
url_env = "SHYFT_RPC_URL"

[[rpc.endpoint]]
name = "public"
url = "https://api.mainnet-beta.solana.com"
enabled = false

[[rpc.endpoint]]
name = "helius"
url_env = "RMR_RPC_URL"
enabled = false

[[rpc.endpoint]]
name = "erpc"
url = "https://edge.erpc.global?api-key=${ERPC_RPC_TOKEN}"
enabled = false

[state]
url = "https://grpc.haandigital.eu:443"
token_env = "HAAN_X_TOKEN"
# WP-03: the state stream also follows the Clock sysvar, the route and venue programs' programdata accounts, and the
# wallet with its token accounts (every landed transaction we pay for writes the wallet: its txn names it)
watch_clock = true
watch_programdata = true
watch_wallet = true
slot_statuses = "auto"  # "all" (processed, confirmed, finalized + first-shred, completed, created-bank, dead) where the probe accepted slots_interslot, else "commitment"
block_meta = "auto"     # on only if `arbx grpc-probe --config deploy/arbx-stage0.toml` accepted it (<out_dir>/probe.json); run the probe before WP-05
# probe_file = ""       # default <out_dir>/probe.json, where `arbx grpc-probe` writes it

# WP-04: state consistency (the plan's defaults, written out). Commit groups: a known write set waits at most
# commit_timeout_ms for its members; an unknown one resolves after quiescence_ms without updates (3 ms is a placeholder:
# arb-lab's moves logs show 0.38-0.63 ms p99.9 across one transaction's pools); readiness: consistency-set skew, tip lag
commit_timeout_ms = 5
quiescence_ms = 3
max_part_skew_slots = 2
max_tip_lag_slots = 2
clock_max_age_slots = 2   # DLMM / DAMM v2 are priced on the Clock sysvar; refused (clock_stale) past this
lag_slo_p50_ms = 16       # first shred of T to T's complete commit, every minute
lag_slo_p90_ms = 30
lag_slo_breach_minutes = 5
slo_action = "log"        # Stage 0: breaches are recorded only (F32)
slo_recover_minutes = 10
tier_a_grace_s = 60       # a pool whose parts are still missing after this leaves Tier A (the warm-up gate)
# PLAN-ADDENDUM I-4: stop (state_unavailable, exit 30) if the state stream delivers nothing within boot_timeout_s; price
# and send nothing while it is down or its newest message is older than max_update_age_ms; read every account again
# after the stream's first connection and every reconnection (review WP-04 #1: the gate is `resync`, and a pool with a
# part not read again is refused, until the re-read lands; a WARNING after resync_warn_s; a chunk still failing
# resync_give_up_s after the start is given up, its accounts staying refused until the stream writes them)
boot_timeout_s = 60
max_update_age_ms = 2000
resnapshot = true
resync_warn_s = 10
resync_give_up_s = 300
unavailable_stop_s = 0    # review WP-04 #10, owner decision: stop (state_unavailable) after this long unavailable; 0 never

# WP-03 item 3: the executed-transaction stream (arb-lab's `haan-grpc` [[feed]]; it runs as a feed after the [[feed]] list,
# so its feed id is unchanged). Haan's plan allows 1 transaction filter with 1 account: PumpSwap (the busiest venue).
# A second filter or provider covering the other venues is owner decision OD-1 (config only: another entry here)
[[state.tx_stream]]
name = "haan-grpc"
# url and token_env: the [state] stream's
account_include = ["pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA"]
failed = true       # failed PumpSwap transactions too (exec.jsonl `ok` false)
max_accounts = 1    # the provider's limit (an include list longer than this refuses to start)

# WP-03 item 10: the LeaderBook's leader kinds (jito / bam / other) and the dated fallback
[leaders]
validator_lists = ["https://kobe.mainnet.jito.network/api/v1/validators"]   # Cherry's address may be refused (403): then the fallback
static_fallback = "/root/arbx/data/validators-meta.json"
refresh_min = 60
# WP-08: host -> leader TPU-QUIC RTT (a QUIC handshake, no data) to the endpoints the leaders of the next 64 slots
# announce, once per endpoint (BAM / Harmonic ingress nodes serve many validators), at most 2 a second; a validator whose
# endpoint refuses takes the median of its endpoint region's (region_bucket). Places (city, metro region) from the table
rtt_probe = true
rtt_per_sec = 2
geo_table = "/root/arbx/data/ip-geo.csv"

# WP-03b: chain fetch (our wallet's transactions, the watched-transaction backfill, the slot index, the blockhash ring)
# and every RPC provider's request budget. A provider's max_rps is a token bucket for the whole process: the boot, the
# executor, the engine's lookup-table fetches and re-snapshots, the LeaderBook and chain fetch all share it (Haan
# answered 429 at about 5 requests/s, sequential: tools/rpc_latency.py, 2026-10-04; two bots got 597-698 Haan 429s in
# cmp2's 28 minutes). Tokens go by priority, and a waiting caller is never overtaken by a later or lower one: boot /
# snapshot / exec first, then engine / leaders / wallet, then the slot index / coverage sample / blockhash poll, then
# the backfill, which runs at what its providers have spare after the others (status chainfetch.cap_rps_now). With
# this split the slot index (about 3.7 getBlock/s) takes most of Shyft, the poll is skipped while the slot index's
# confirmed hashes are fresh, and the backfill gets about 3.9/s, nearly all on Haan (test
# the_slot_index_keeps_up_while_the_backfill_has_demand, P1's load), against the 16-35/s that non-PumpSwap watched
# transactions need (PLAN §0): status.jsonl chainfetch.need_rps_now against have_rps_now shows the shortfall, and OD-1
# decides the capacity. Our attempts' signatures cost one getSignatureStatuses every 2 s while any is in flight
[chainfetch]
after_ms = 1500          # a watched transaction this long without an exec.jsonl record is backfilled
rps = "auto"             # the backfill: 1.25 x the uncovered rate (1-minute EWMA), capped by its providers' max_rps
max_backlog = 200000
sample_every_s = 60      # one full block a minute: the share of watched transactions no source reported
blockhash_poll_ms = 400  # getLatestBlockhash (confirmed), only while no other source gave a fresh confirmed blockhash
sigs_every_s = 3600      # getSignaturesForAddress(wallet) over the last hour
default_max_rps = 0      # no bucket for an [rpc] provider not listed below
boot_retry_s = 90        # PLAN-ADDENDUM I-1: at boot a call retries with backoff across the providers this long
max_tx_version = 1       # mainnet blocks carry v1 transactions: with 0 a provider refuses the whole block (-32015)

[[chainfetch.provider]]
name = "haan"
roles = ["wallet", "blockhash", "backfill"]
max_rps = 4
reserve = { backfill = 0.5 }   # FT-000 S1-1: 2/s of Haan's 4 for the backfill, whatever the busier roles ask (it got 4 fetches in 30 min)

[[chainfetch.provider]]
name = "shyft"
roles = ["slotidx", "sample", "backfill", "wallet"]
max_rps = 4
reserve = { slotidx = 0.95 }   # FT-000 S1-1: 3.8/s of Shyft's 4 for the slot index (one getBlock a confirmed slot, 3.7/s; it fell 3,005 slots behind)

[strategy]
# WP-04: decoded swaps are hints only (their write set goes to the CommitTracker, their predictions to the accuracy
# monitor); `confirm_trigger_ms` and `decoded_sends` are gone (there is no decoded send path: a config with them does not load)
skip_failing_signers = true   # WP-00: stopgap (R §4 day 0); live had false. With hints never priced it only drops their accuracy check
state_triggers = true   # price on committed state (complete commit groups): the only path that prices and sends
budget_caps_sol = [0.165, 2.1, 4.2, 8.4, 21.0, 42.0, 84.0]   # EXP-4: $20, $250, $500, $1k, $2.5k, $5k, $10k at SOL $119: the best round trip at each budget (recorded, not traded)
signer_stats_file = "/root/arbx/runs/signer-stats.json"   # read at start, never written (I-5): each segment writes signer-stats.json and signer-stats-delta.json into its run dir; `arbx signer-stats merge` folds deltas back
sizes_sol = [0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 4.2]   # $500 run: the size search reaches the 4.2 SOL cap
# record every round trip that clears base + priority fee; the report applies each send path's tip
min_profit_lamports = 1
cu_price_micro = 40000
outcome_watch_ms = 2000

