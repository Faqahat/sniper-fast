[ledger]
# WP-07: money from the chain: every wallet transaction split into summing categories (ledger.jsonl), balance snapshots at
# start, every snapshot_min inside the segment and at stop (snapshots.jsonl), the reconciliation within tolerance_lamports on
# both bases and of the executor's money against the chain (recon.jsonl; a miss puts the bot in shadow). The money view (the
# last snapshot and the entries after it) is stale, and nothing is sent (`equity_stale`), once it is older than
# max_view_age_s, after stale_after_failures failed snapshots in a row, or while a landing waits max_record_wait_s for its record
snapshot_min = 10
max_view_age_s = 600
stale_after_failures = 3
max_record_wait_s = 120
tolerance_lamports = 10000
recon_grace_s = 60
token_haircut = 0.10

[supervisor]
# WP-07 (OD-11, campaign-wide; review WP-07 #4): shadow and stop when the net spend (fees, tips, non-recoverable rent,
# trading loss; the owner's transfers are not in it) passes max_drop_per_hour_sol within a rolling hour, max_drop_per_day_sol
# within 24 h, or the test budget since the campaign's start; a token held at the start below its start amount less
# token_floor_tolerance. test_budget_lamports = 0: none here, so a live or canary run of this file refuses to start until the
# owner sets one (or a campaign passes --budget-left). Every live or canary start also draws on the owner's cumulative budget
# (<out_dir>/budget-state.json, src/budget.rs). The frz canary: deploy/arbx-canary-frz.toml
max_drop_per_hour_sol = 0.02
max_drop_per_day_sol = 0.15
test_budget_lamports = 0
token_floor_tolerance = 0.001
rent_cap_sol = 0.1   # held-set additions only (off: [builder] held_max = 0); a create+close in one transaction locks nothing
native_floor_sol = 0.02
auto_unwrap = false
stranded_s = 60

[alerts]
# WP-20 (PLAN-ADDENDUM): Telegram alerts to the owner's "ArbX" group. The token and the chat id live only in
# /root/arbx/deploy/.env (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID; mode 600), never in this file: missing ones turn the alerts
# off with one warning, never fatal. Producers never wait (a bounded queue); one sender on rt_bg posts over HTTPS.
# `arbx alert-test --config <this file>` sends one test message.
enabled = true
token_env = "TELEGRAM_BOT_TOKEN"
chat_env = "TELEGRAM_CHAT_ID"
heartbeat_min = 60      # a heartbeat with the key numbers every hour, across segments (0: none)
min_level = "info"      # info, warning, error, critical
dedup_s = 600           # the same alert again within 10 minutes is counted, not sent
rate_per_min = 20       # Telegram allows a group 20 messages a minute
coalesce_ms = 2000      # a burst within 2 s goes out as one message (a Critical alert goes at once)
daily_summary = true    # at 00:00 UTC, the day before: win ratio (wins / bundles sent), net, fees, tips, rent

[watchdog]
# WP-20: `arbx watchdog --config deploy/arbx-stage0.toml`, a separate long-running process (docs/field-tests/README.md)
runs_dir = "/root/arbx/runs"
grace_s = 120           # no segment process for longer than this is "not running" (covers the gap between two segments)
status_min = 60         # "running" every hour, and a reminder every hour while it is down
